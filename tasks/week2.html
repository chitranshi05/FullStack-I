<!-- JS Quiz Arena - a quiz app
show one question at a time with 4 clickable options, a progress line ("q3/25"),and a live score
after a click turn the chosen option green or red ,reveal the correct one,show the explanation,and lock the other options
include next and restart button.At the end show the final score and a rating message
add a 30 second countdown per question when it hits 0, auto lock the question and reveal the answer
add a "review wrong answers" screen at the end -->



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JS Quiz Arena</title>
    <link rel="stylesheet" href="style.css">
    <script src="week2.js" defer></script>
    <style>
        
body {
    font-family: Arial, sans-serif;
    margin: 30px;
}

.quiz {
    max-width: 500px;
    margin: auto;
}

h1 {
    text-align: center;
}

#options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 20px 0;
}

.option {
    padding: 10px;
    text-align: left;
    cursor: pointer;
}

.correct {
    background-color: lightgreen;
}

.wrong {
    background-color: red;
}

#next {
    padding: 8px 16px;
    cursor: pointer;
}

button:disabled {
    cursor: not-allowed;
}

    </style>
</head>
<body>
    <div class="quiz">
        <h1>JS Quiz Arena</h1>

        <p id="progress">Question 1 / 5</p>
        <h2 id="question"></h2>

        <div id="options"></div>

        <p id="result"></p>

        <button id="next" disabled>Next</button>
    </div>
</body>
</html>
