
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyTube</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        /* NAVBAR */
        .navbar {
            width: 100%;
            height: 50px;
            display: flex;
            flex-direction: row;
            position: fixed;
            top: 0;
            left: 0;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background-color: white;
            box-shadow: 0 2px 3px grey;
            z-index: 100;
        }

        .logo {
            color: red;
            font-size: 20px;
            font-weight: bold;
        }

        .navbar input {
            width: 300px;
            padding: 7px;
            border: 1px solid grey;
            border-radius: 5px;
        }

        .profile {
            display: inline-block;
            background: grey;
            width: 30px;
            height: 30px;
            border-radius: 50%;
        }

        /* MAIN CONTAINER */
        .main {
            display: flex;
            margin-top: 50px;
        }

        /* SIDEBAR */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: calc(100vh - 50px);
            width: 170px;
            padding: 15px 10px;
            position: fixed;
            top: 50px;
            left: 0;
            box-shadow: 1px 0 3px grey;
            background-color: white;
        }

        .sidebar div {
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
        }

        .sidebar div:hover {
            background-color: lightgrey;
        }

        /* VIDEO CARDS CONTAINER */
        .card {
            margin-left: 190px;
            padding: 20px;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 25px;
            flex: 1;
        }

        /* INDIVIDUAL VIDEO */
        .video {
            width: 220px;
            border: 1px solid lightgrey;
            border-radius: 5px;
            overflow: hidden;
        }

        .video div {
            width: 100%;
            height: 130px;
            background-color: grey;
        }

        .video h4 {
            padding: 10px;
            font-size: 14px;
        }

    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">MyTube</div>

        <input type="text" placeholder="Search">

        <div>
            <span class="profile"></span>
        </div>
    </nav>


    <!-- MAIN LAYOUT -->
    <div class="main">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div>Home</div>
            <div>Trending</div>
            <div>Subscriptions</div>
            <div>Library</div>
            <div>History</div>
            <div>Watch Later</div>
        </aside>


        <!-- VIDEO CARDS -->
        <div class="card">

            <div class="video">
                <div></div>
                <h4>Video Title 1</h4>
            </div>

            <div class="video">
                <div></div>
                <h4>Video Title 2</h4>
            </div>

            <div class="video">
                <div></div>
                <h4>Video Title 3</h4>
            </div>

            <div class="video">
                <div></div>
                <h4>Video Title 4</h4>
            </div>

            <div class="video">
                <div></div>
                <h4>Video Title 5</h4>
            </div>

            <div class="video">
                <div></div>
                <h4>Video Title 6</h4>
            </div>

        </div>

    </div>

</body>
</html>
