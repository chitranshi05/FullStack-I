<!DOCTYPE html>
<html>
<head>
  <style>
    .moustache {
      width: 100px;
      height: 40px;
      position: relative;
      margin: 100px auto;
    }

    .moustache::before,
    .moustache::after {
      content: "";
      position: absolute;
      width: 50px;
      height: 25px;
      background: black;
      border-radius: 100% 0 100% 0;
      top: 10px;
    }

    .moustache::before {
      left: 0;
      transform: rotate(-20deg);
    }

    .moustache::after {
      right: 0;
      transform: rotate(20deg) scaleX(-1);
    }
  </style>
</head>

<body>
  <div class="moustache"></div>
</body>
</html>
