
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f4f6;
      font-family: Arial, sans-serif;
    }

    .chart{
      width: 260px;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: white;
      border-radius: 20%;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
    }

    .donut {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: conic-gradient(
        #1d4ed8 0 75%,
        #dbeafe 75% 100%
      );
      position: relative;
    }

    .donut::before {
      content: "";
      position: absolute;
      inset: 22px;
      background: white;
      border-radius: 50%;
    }

    .percent {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: bold;
      color: #1d4ed8;
      z-index: 1;
    }
    .border {
      width: 150px;
      height: 150px;
      position: absolute;
      inset: 0;
      border: 4px solid #1d4ed8;
      border-radius: 20%;
      pointer-events: none;
      background: black,conic-gradient(75,red,blue,purple
      );
    }
  </style>
</head>
<body>
  <div class="chart">
    <div class="donut">
      <div class="percent">87%</div>
    </div>
  </div>
  <div class="border">
     <style>background-color:black</style>
  </div>
</body>
</html>
