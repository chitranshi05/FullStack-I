<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fixed Conic Border and Gradient Text</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column; 
      gap: 40px;            
      align-items: center;
      justify-content: center;
      background: black;
      font-family: Arial, sans-serif;
    }

    .box {
      width: 260px;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: black;
      border-radius: 20%;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5); /* Deepened for black background visibility */
    }
   
    .conic-border {
      position: absolute;
      inset: -15px;
      border: 4px solid transparent;
      border-radius: 20%;
      pointer-events: none;
      background: 
        linear-gradient(black, black) padding-box, 
        conic-gradient(from 0deg, red, blue, purple, red) border-box;
    }

    .box2 {
        font-size: 100px;
        text-align: center;
        -webkit-text-stroke-width: 1px white;
        -webkit-text-stroke-color: transparent;
        background: linear-gradient(pink ,white);
        color:transparent;
        font-weight: bold;
    }
    
    /* Fixed Gradient Text Styling */
    .p {
      margin: 0;
      font-size: 100px;
      font-weight: bold;
      background: linear-gradient(pink, white);
      -webkit-background-clip: text;       
      background-clip: text;
      color: transparent;                   
      -webkit-text-stroke: 1px white;   }
  </style>
  
</head>
<body>

  <div class="box">
    <div class="conic-border"></div>
  </div>

  <div class="box2">
    <p class="p">HELLO</p>
  </div>

</body>
</html>
