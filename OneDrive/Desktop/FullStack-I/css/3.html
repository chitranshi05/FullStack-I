<!DOCTYPE html>
<html>

<head>
    <title>Product Cards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f4f4;
        }

        .container {
            width: 106%;
            margin: 40px auto;

            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .card {
            width: 250px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-left: 2% 
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        .card img {
            width: 100%;
            border-radius: 10px;
        }

        .card h3 {
            margin: 10px 0 10px;
        }

        .card p {
            color: green;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .card button {
            padding: 10px 20px;
            border: none;
            background: #007BFF;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .card button:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">
            <img src="" alt="Product">
            <h3>Product 1</h3>
            <p>$299</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="" alt="Product">
            <h3>Product 2</h3>
            <p>$499</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="" alt="Product">
            <h3>Product 3</h3>
            <p>$699</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="" alt="Product">
            <h3>Product 4</h3>
            <p>$999</p>
            <button>Buy Now</button>
        </div>

    </div>

</body>

</html>
