<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEM</title>
    <style>
        .card{
            width: 200px;
            padding: 3%;
            border: 1px solid black;
            box-shadow: 2px 2px 5px gray;
            border-radius: 10px;
        }
        .card_text{
            font-family: Arial, sans-serif;
            font-size: 20px;
            color: black;
        }
        .card_button__submit{
            background-color: blue;
            color: white;
            border: none;
            box-shadow: 2px 2px 5px gray;
            padding: 10px 20px;
            border-radius: 5px;
        }
    </style>

</head>
<body><div class="card">
                <img class="card-img" />
                <p class="card-text">This is a card</p>
                <button class="card-button">Click me</button><div class="card"></div>

</body>
</html>
