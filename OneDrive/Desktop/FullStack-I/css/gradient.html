<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gradient Donut Chart</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f4f6;
      font-family: Arial, sans-serif;
    }

    .chart {
      width: 260px;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: white;
      border-radius: 20%;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
    }

    .donut {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      position: relative;

      /* Smooth blue gradient with 87% progress */
      background: conic-gradient(
        from 0deg,
        #bfdbfe 0%,
        #60a5fa 35%,
        #2563eb 70%,
        #1e3a8a 87%,
        #e5e7eb 87% 100%
      );
    }
    .donut::before {
      content: "";
      position: absolute;
      inset: 22px;
      background: white;
      border-radius: 50%;
    }

    .percent {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 2rem;
      font-weight: bold;
      color: #1d4ed8;

      z-index: 1;
    }
  </style>
</head>

<body>

  <div class="chart">

    <div class="donut">
      <div class="percent">87%</div>
    </div>

</body>
</html>
