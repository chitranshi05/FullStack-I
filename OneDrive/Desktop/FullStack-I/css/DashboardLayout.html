<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Bento Design</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            padding: 20px;
            background: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        .bento-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 150px);
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .box {
            background: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            border: 2px solid #ddd;
            cursor: pointer;
            transition: 0.3s;
           
        }

        .box-1 {
            grid-column: 1/5;
            background: #667eea;
            color: white;
        }

        .box-2 {
            grid-column: 2 / 5;
            background: #f093fb;
            color: white;
        }

        .box-3 {
            grid-row: 2 / 5;
            background: #4facfe;
            color: white;
        }

        .box-4 {
            grid-column: 2 / 4;
            background: #43e97b;
            color: white;
        }

        .box-5 {
            grid-column: 4/ 5;
            background: #fa709a;
            color: white;
        }

        .box-6 {
            grid-column: 1 / 5;
            background: #ff9a56;
            color: white;
        }

        @media (max-width: 768px) {
            .bento-grid {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: repeat(auto-fit, 120px);
            }

            .box-1,
            .box-2,
            .box-4 {
                grid-column: 1 / 3;
            }

            .box-3,
            .box-5,
            .box-6{
                grid-column: 1 / 2;
            }
        }

        @media (max-width: 480px) {
            .bento-grid {
                grid-template-columns: 1fr;
            }

            .box {
                grid-column: 1 !important;
            }

            .box {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>
    <div class="bento-grid">
        <div class="box box-1">Header</div>
        <div class="box box-2">Main content</div>
        <div class="box box-3">Sidebar</div>
        <div class="box box-4">card1</div>
        <div class="box box-5">card2</div>
        <div class="box box-6">footer</div>
    </div>
</body>

</html>
