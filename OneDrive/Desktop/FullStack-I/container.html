<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
     .container{
        flex-direction:row;
        outline: 3px solid black;
        display: flex;

     .container > div{

        width :150px;

     }
     #box3{
        background-color: blue;
        flex-basis: 150px;
     }
    </style>
</head>


<body>
    <div class="container">
        <div id="box1">Box 1</div>
        <div id="box2">Box 2</div>
        <div id="box3">Box 3</div>
    </div>
</body>
</html>
