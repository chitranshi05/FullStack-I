<!DOCTYPE html>
<html>
<head>
    <title>Navbar</title>
 
    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#337;
    padding:15px 40px;
}

.logo{
    color:white;
    font-size:24px;
    font-weight:bold;
}

.menu{
    display:flex;
    gap:30px;
}

.menu a{
    color:white;
    text-decoration:none;
    font-size:18px;
}

.menu a:hover{
    color:yellow;
}
    </style>
</head>
<body>

    <nav>
        <div class="logo">MyLogo</div>

        <div class="menu">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>
    </nav>

</body>
</html>
